events { worker_connections 1024; }

http {
    upstream auth_service {
        server auth-service:8080;
    }

    upstream mile_portal {
        server mile-portal:80;
    }

    server {
        listen 80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AuthService: authentication, user accounts, service accounts
        location /api/v1/auth/ {
            proxy_pass http://auth_service;
        }

        location /api/v1/users {
            proxy_pass http://auth_service;
        }

        location /api/v1/service-clients {
            proxy_pass http://auth_service;
        }

        location = /.well-known/openid-configuration {
            proxy_pass http://auth_service;
        }

        # Unknown API paths: JSON 404 instead of falling through to the SPA's index.html.
        location /api/ {
            default_type application/problem+json;
            return 404 '{"title":"Not found","status":404,"detail":"No service handles this API route."}';
        }

        # Everything else is the React SPA (mile-portal container).
        location / {
            proxy_pass http://mile_portal;
        }

        # Token check for auth_request; downstream locations can use:
        #   auth_request /_auth;
        #   auth_request_set $auth_sub $upstream_http_x_auth_subject;
        location = /_auth {
            internal;
            proxy_pass http://auth_service/api/v1/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }
    }
}
