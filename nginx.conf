# One worker per CPU: a single worker saturates at ~600 req/s with 1000 pings/s of telemetry (FleetTrackingService NFR-1).
worker_processes auto;

events { worker_connections 4096; }

http {
    # Docker's embedded DNS. Upstreams are resolved per request (via variables) instead of once at startup, so:
    #  - the gateway starts even if a service is still down, and
    #  - recreating a container (new IP) does not leave NGINX pointing at the old address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Public shipment tracking (decision S3): per-client-IP rate limit against tracking-number guessing / scraping.
    limit_req_zone $binary_remote_addr zone=tracking:10m rate=5r/s;

    # Public live map by tracking number (FleetTrackingService T3): same rate, plus at most 10 open streams per IP.
    limit_req_zone  $binary_remote_addr zone=live_tracking:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=live_streams:10m;

    # FleetTrackingService T4: cache the token check for 30 s, keyed by the full Authorization header, so 1000 pings/s
    # cost AuthService ~1 /validate per token per 30 s. Only 200s are cached; a revoked token stops working within 30 s.
    proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=auth_cache:10m max_size=50m inactive=60s use_temp_path=off;

    # FleetTrackingService upstream with a keepalive pool: no new TCP connection per ping. `resolve` re-resolves the
    # container name (like the per-request variables used for the other services), so a recreated container is found.
    upstream tracking_backend {
        zone tracking_backend 64k;
        server tracking-service:8080 resolve;
        keepalive 64;
    }

    map $http_authorization $cache_no_token {
        ""      1;
        default 0;
    }

    server {
        listen 80;

        set $auth_service    http://auth-service:8080;
        set $profile_service http://profile-service:8080;
        set $fleet_service    http://fleet-service:8080;
        set $shipment_service http://shipment-service:8080;
        set $mile_portal     http://mile-portal:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AuthService: authentication, user accounts, service accounts
        location /api/v1/auth/ {
            proxy_pass $auth_service;
        }

        location /api/v1/users {
            proxy_pass $auth_service;
        }

        location /api/v1/service-clients {
            proxy_pass $auth_service;
        }

        location = /.well-known/openid-configuration {
            proxy_pass $auth_service;
        }

        # ProfileService: admin and client profiles. The token is checked by AuthService first (auth_request,
        # catches blacklisted tokens), and ProfileService re-validates it locally and applies RBAC.
        location /api/v1/profiles/ {
            auth_request /_auth;
            error_page 401 = @unauthorized;
            proxy_pass $profile_service;
        }

        # FleetService: drivers, availability, vehicles. Same edge check as ProfileService.
        location /api/v1/fleet/ {
            auth_request /_auth;
            error_page 401 = @unauthorized;
            proxy_pass $fleet_service;
        }

        # ShipmentService, public tracking link: no token, rate-limited (longest prefix wins over /api/v1/shipments).
        location /api/v1/shipments/track/ {
            limit_req zone=tracking burst=20 nodelay;
            limit_req_status 429;
            proxy_pass $shipment_service;
        }

        # ShipmentService: everything else requires a valid, non-revoked token.
        location /api/v1/shipments {
            auth_request /_auth;
            error_page 401 = @unauthorized;
            proxy_pass $shipment_service;
        }

        # FleetTrackingService, public live map by tracking number: no token, rate- and connection-limited, SSE-ready.
        location /api/v1/tracking/track/ {
            limit_req zone=live_tracking burst=20 nodelay;
            limit_req_status 429;
            limit_conn live_streams 10;
            limit_conn_status 429;
            proxy_buffering off;              # SSE: pass events through immediately
            proxy_read_timeout 1h;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://tracking_backend;
        }

        # FleetTrackingService: ingestion (1000 pings/s), live positions, history. Token check cached 30 s (T4).
        location /api/v1/tracking/ {
            auth_request /_auth_cached;
            error_page 401 = @unauthorized;
            proxy_buffering off;              # SSE (admin fleet stream)
            proxy_read_timeout 1h;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://tracking_backend;
        }

        # Unknown API paths: JSON 404 instead of falling through to the SPA's index.html.
        location /api/ {
            default_type application/problem+json;
            return 404 '{"title":"Not found","status":404,"detail":"No service handles this API route."}';
        }

        # Everything else is the React SPA (mile-portal container).
        location / {
            proxy_pass $mile_portal;
        }

        location @unauthorized {
            default_type application/problem+json;
            add_header WWW-Authenticate 'Bearer' always;
            return 401 '{"title":"Unauthorized","status":401,"detail":"A valid, non-revoked access token is required."}';
        }

        # Token check for auth_request; downstream locations can use:
        #   auth_request /_auth;
        #   auth_request_set $auth_sub $upstream_http_x_auth_subject;
        location = /_auth {
            internal;
            proxy_pass $auth_service/api/v1/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # Same check, cached per token for 30 s (high-frequency tracking routes only). Empty tokens are never cached.
        location = /_auth_cached {
            internal;
            proxy_cache auth_cache;
            proxy_cache_key $http_authorization;
            proxy_cache_valid 200 30s;
            proxy_cache_bypass $cache_no_token;
            proxy_no_cache $cache_no_token;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_pass $auth_service/api/v1/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }
    }
}
