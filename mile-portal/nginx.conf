# Static server for the SPA inside the mile-portal container.
# API traffic never reaches this server: the gateway routes /api/* to the microservices.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets: cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/home, /account, /admin/users...) all serve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
