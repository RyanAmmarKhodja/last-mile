version: '3.8'

services:
  auth-service:
    build: ./AuthService
    container_name: auth-service
    networks:
      - app-net
    environment:
      - ASPNETCORE_URLS=http://+:8080

  nginx:
    image: nginx:latest
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
    networks:
      - app-net

networks:
  app-net:
    driver: bridge