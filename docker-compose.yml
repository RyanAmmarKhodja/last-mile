services:
  auth-service:
    build:
      context: .                      # repository root: the image needs shared/ (contracts + messaging)
      dockerfile: AuthService/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    networks:
      - app-net
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AuthDb=Host=auth-postgres;Port=5432;Database=auth_db;Username=auth_user;Password=letmein;GSS Encryption Mode=Disable
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__SchemaRegistryUrl=http://schema-registry:8081
    # No dependency on Kafka: events wait in the outbox until the broker is reachable.
    depends_on:
      auth-postgres:
        condition: service_healthy

  profile-service:
    build:
      context: .                      # repository root: the image needs shared/ (contracts + messaging)
      dockerfile: ProfileService/Dockerfile
    container_name: profile-service
    restart: unless-stopped
    networks:
      - app-net
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ProfileDb=Host=profile-postgres;Port=5432;Database=profile_db;Username=profile_user;Password=letmein;GSS Encryption Mode=Disable
      - Jwt__MetadataAddress=http://auth-service:8080/.well-known/openid-configuration
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__SchemaRegistryUrl=http://schema-registry:8081
    # No dependency on Kafka or AuthService: events wait in Kafka / the outbox, and signing keys are fetched on first use.
    depends_on:
      profile-postgres:
        condition: service_healthy

  profile-postgres:
    image: postgres:16-alpine
    container_name: profile_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: profile_user
      POSTGRES_PASSWORD: letmein
      POSTGRES_DB: profile_db
    ports:
      # 5434 on the host (auth_db uses 5433)
      - "5434:5432"
    volumes:
      - profile_pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_user -d profile_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  mile-portal:
    build: ./mile-portal
    container_name: mile-portal
    restart: unless-stopped
    networks:
      - app-net

  nginx:
    image: nginx:latest
    container_name: nginx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - profile-service
      - mile-portal
    networks:
      - app-net

  auth-postgres:
    image: postgres:16-alpine
    container_name: auth_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: letmein
      POSTGRES_DB: auth_db
    ports:
      # 5433 on the host: a local PostgreSQL already listens on 5432
      - "5433:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Message broker (documents/kafka-architecture.md §8) -------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    networks:
      - app-net
    ports:
      # Host access for running services / tools outside docker (bootstrap: localhost:9094)
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"     # topics come from infra/kafka/create-topics.sh
      KAFKA_LOG_RETENTION_HOURS: 720               # 30 days
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    restart: "no"
    networks:
      - app-net
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/create-topics.sh"]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: FORWARD_TRANSITIVE   # producers may add fields; old consumers must still read new events (verified, see kafka-architecture.md §4)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-ui:                            # dev only: topics, messages, consumer lag, DLQs, schemas
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: last-mile
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

networks:
  app-net:
    driver: bridge

volumes:
  auth_pgdata:
  profile_pgdata:
  kafka_data:
