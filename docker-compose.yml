version: '3.8'

services:
  auth-service:
    build: ./AuthService
    container_name: auth-service
    restart: unless-stopped
    networks:
      - app-net
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AuthDb=Host=auth-postgres;Port=5432;Database=auth_db;Username=auth_user;Password=letmein
    depends_on:
      auth-postgres:
        condition: service_healthy

  mile-portal:
    build: ./mile-portal
    container_name: mile-portal
    restart: unless-stopped
    networks:
      - app-net

  nginx:
    image: nginx:latest
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - mile-portal
    networks:
      - app-net

  auth-postgres:
    image: postgres:16-alpine
    container_name: auth_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: letmein
      POSTGRES_DB: auth_db
    ports:
      # 5433 on the host: a local PostgreSQL already listens on 5432
      - "5433:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  app-net:
    driver: bridge

volumes:
  auth_pgdata:
